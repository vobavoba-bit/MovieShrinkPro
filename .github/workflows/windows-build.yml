name: Build MovieShrinkPro Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install builder
        run: python -m pip install --disable-pip-version-check pyinstaller==6.11.1 Pillow==11.1.0
      - name: Test subtitle rendering and time shift
        shell: pwsh
        run: python subtitle_smoke.py
      - name: Validate compact GUI controls
        shell: pwsh
        run: python ui_smoke.py
      - name: Get Windows FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath unpack
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $a = Get-ChildItem unpack -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $b = Get-ChildItem unpack -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (!$a -or !$b) { throw 'ffmpeg.exe or ffprobe.exe is missing' }
          Copy-Item $a.FullName bin/ffmpeg.exe
          Copy-Item $b.FullName bin/ffprobe.exe
      - name: Exercise real video preview, queue and screenshot
        shell: pwsh
        run: python preview_integration.py
      - name: Generate Windows app icon from the MovieShrink Pro logo
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('assets/movieshrink_logo.jpg').save('assets/movieshrink.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64)])"
      - name: Build single self-contained EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --icon assets/movieshrink.ico --name MovieShrinkPro --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" --add-data "assets/movieshrink_logo.jpg;assets" MovieShrinkPro.py
      - name: Run packaged conversion self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/MovieShrinkPro.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE conversion self-test failed with $($p.ExitCode)" }
      - name: Use larger desktop when supported for visual verification
        shell: pwsh
        run: python setup_test_display.py
      - name: Check GUI launches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/MovieShrinkPro.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 9
          $p.Refresh()
          if ($p.HasExited) { throw "GUI exited unexpectedly with $($p.ExitCode)" }
          try {
            python capture_real_gui.py
            python capture_large_gui.py
          } finally {
            Stop-Process -Id $p.Id -Force
          }
      - name: Verify actual screenshot contains green Start and red Stop
        shell: pwsh
        run: python verify_real_gui.py
      - name: Verify a real embedded banner in the standalone EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from PIL import Image; i=Image.open('MovieShrinkPro_Real_Large_Window.png'); w,h=i.size; i.crop((0,30,w,min(h,150))).save('banner_smoke.jpg',quality=80)"
          New-Item -ItemType Directory -Force -Path dist/embedded | Out-Null
          Copy-Item dist/MovieShrinkPro.exe dist/embedded/MovieShrinkPro.exe
          python embed_banner.py dist/embedded/MovieShrinkPro.exe banner_smoke.jpg
          $exe = (Resolve-Path 'dist/embedded/MovieShrinkPro.exe').Path
          $verify = Start-Process -FilePath $exe -ArgumentList '--verify-banner' -Wait -PassThru
          if ($verify.ExitCode -ne 0) { throw "The real GUI could not read its embedded header" }
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Embedded-banner self-test failed with $($p.ExitCode)" }
          $gui = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 7
          $gui.Refresh()
          if ($gui.HasExited) { throw "Embedded-banner GUI exited unexpectedly with $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force
      - name: Create download ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/embedded/MovieShrinkPro.exe -DestinationPath MovieShrinkPro_Windows10_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MovieShrinkPro_Windows10_x64
          path: MovieShrinkPro_Windows10_x64.zip
          retention-days: 30

      - name: Upload actual Windows application screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MovieShrinkPro_Actual_Screenshot
          path: MovieShrinkPro_Actual_Windows_Screenshot.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload large real Windows screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MovieShrinkPro_Real_Large_UI
          path: MovieShrinkPro_Real_Large_Window.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload actual preview integration screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MovieShrinkPro_Real_TestVideo_Preview
          path: MovieShrinkPro_Real_Preview_Test.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload genuine in-progress Windows conversion screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MovieShrinkPro_Real_Transcoding_Progress
          path: MovieShrinkPro_Real_Progress_Test.png
          if-no-files-found: ignore
          retention-days: 30
